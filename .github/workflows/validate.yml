name: Validate

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository structure
        run: |
          test -f repository.yaml
          python3 - <<'PY'
          import pathlib, sys
          import yaml
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])
              import yaml
          data = yaml.safe_load(pathlib.Path("repository.yaml").read_text())
          assert data.get("name"), "repository.yaml missing name"
          assert data.get("url"), "repository.yaml missing url"
          PY
