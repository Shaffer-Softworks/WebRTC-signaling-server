# https://developers.home-assistant.io/docs/add-ons/configuration
name: WebRTC Signaling Server
version: "1.3.3"
slug: webrtc_signaling
description: WebRTC signaling server for LAN intercom with dashboard. JSON protocol (register, offer/answer/candidate, hangup, clientsList, and related message types).
url: "https://github.com/Shaffer-Softworks/WebRTC-signaling-server/tree/main/webrtc_signaling"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: false
ingress: true
ingress_port: 8765
panel_icon: mdi:video-wireless
panel_title: "WebRTC Signaling"
ports:
  "8765/tcp": 8765
ports_description:
  "8765/tcp": "WebSocket signaling, dashboard, and ingress (expose on LAN for direct clients)"
map: []
options:
  port: 8765
  openobserve_url: ""
  openobserve_username: ""
  openobserve_password: ""
schema:
  port: "int(1,65535)?"
  openobserve_url: "str?"
  openobserve_username: "str?"
  openobserve_password: "password?"
